services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindmap
      POSTGRES_USER: mindmap
      POSTGRES_PASSWORD: mindmap
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mindmap -d mindmap" ]
      interval: 4s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mindmap:mindmap@db:5432/mindmap24h
      PORT: 3001
    ports:
      - "${BACKEND_PORT:-3031}:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ../backend/src
          target: /app/src
          ignore:
            - node_modules
        - action: rebuild
          path: ../backend/package.json

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3031/api}
    ports:
      - "${FRONTEND_PORT:-3030}:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    develop:
      watch:
        - action: sync
          path: ../frontend/src
          target: /app/src
          ignore:
            - node_modules
        - action: sync
          path: ../frontend/public
          target: /app/public
        - action: rebuild
          path: ../frontend/package.json

volumes:
  pgdata: